[package]
name = "retrotool-gui"
description = "Tools for working with Retro game formats."
authors = ["Luke Street <luke@street.dev>"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/PrimeDecomp/retrotool"
readme = "README.md"

[features]
default = []
dynamic = ["bevy/dynamic_linking"]
embed = ["bevy_embedded_assets"]
nightly = ["half/use-intrinsics"]

[dependencies]
anyhow = "1.0.69"
bevy_egui = { version = "0.42.0", features = ["accesskit"] }
bevy_embedded_assets = { version = "0.16.0", optional = true }
bevy_math = { version = "0.19.1", features = ["mint"] }
bit-set = "0.5.3"
bytemuck = { version = "1.13.0", features = ["min_const_generics"] }
egui = { version = "0.36.2", features = ["mint"] }
egui_dock = "0.21.1"
event-listener = "5.4.2"
half = { version = "2.4.1", features = ["bytemuck"] }
image = "0.24.5"
indexmap = "1.9.2"
log = "0.4.17"
mint = "0.5.9"
num-traits = "0.2.15"
remax = { path = "../remax" }
retrolib = { path = "../lib" }
serde = "1.0.156"
serde_json = "1.0.94"
strum = "0.24.1"
uuid = "1.3.0"
walkdir = "2.3.2"
wgpu = { version = "29.0.4", default-features = false, features = ["std", "metal", "vulkan", "dx12", "wgsl"] }
wgpu-types = "29.0.4"
zerocopy = "0.7.32"

[dependencies.bevy]
version = "0.19.1"
default-features = false
features = [
    "std",
    "default_app",
    "multi_threaded",
    "sysinfo_plugin",
    "accesskit_unix",
    "bevy_asset",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "mesh_picking",
    "x11",
    # remove eventually
    "ktx2",
    "tonemapping_luts",
    "zstd_rust",
    "png",
]
